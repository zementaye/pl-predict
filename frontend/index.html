<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="eyebrow">Premier League</div>
    <h1>PL Predictor</h1>
  </header>

  <main id="content" class="content">
    <div class="loading">Warming up the pitch…</div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="fixture">
      <span class="tab-icon">⚽</span><span>Fixture</span>
    </button>
    <button class="tab" data-tab="table">
      <span class="tab-icon">🏆</span><span>Table</span>
    </button>
    <button class="tab" data-tab="history">
      <span class="tab-icon">📋</span><span>History</span>
    </button>
  </nav>

</div>

<script src="/static/app.js"></script>
</body>
</html>
