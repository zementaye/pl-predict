<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">PL</div>
      <div class="brand-copy">
        <div class="eyebrow">Premier League</div>
        <h1>Predictor</h1>
      </div>
    </div>
    <div class="top-status"><span class="status-dot"></span>LIVE</div>
  </header>

  <div class="stats-strip" id="statsStrip"></div>

  <main id="content" class="content">
    <div class="loading">Warming up the pitch…</div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="fixture">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.6 2.6-1.4 4.2h-4.4l-1.4-4.2z"/><path d="M12 3v4.5M12 20.5V16M3.5 9.5l3.3 1.6M17.2 12.9l3.3 1.6M3.5 14.5l3.3-1.6M17.2 11.1l3.3-1.6"/></svg></span><span>Fixture</span>
    </button>
    <button class="tab" data-tab="table">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6M9.5 17h5l.5 3h-6z"/></svg></span><span>Table</span>
    </button>
    <button class="tab" data-tab="history">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg></span><span>History</span>
    </button>
  </nav>

</div>

<script src="/static/app.js"></script>
</body>
</html>
